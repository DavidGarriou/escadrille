[package]
name = "escadrille"
description = "Panache blanc: the Bevy game binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Textures of diffuse transmission, for the translucent fabric (ADR 0004, features).
bevy = { workspace = true, features = ["pbr_transmission_textures"] }
escadrille_data.workspace = true
bevy_egui.workspace = true
clap.workspace = true

[features]
# Faster incremental builds for `just run`; never used for release or captures.
dev = ["bevy/dynamic_linking"]

[lints]
workspace = true
