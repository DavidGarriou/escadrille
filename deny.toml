# cargo-deny configuration. The licence list mirrors CLAUDE.md ("Contraintes non négociables").

[graph]
all-features = true

[advisories]
yanked = "deny"
# Each ignored advisory is a decision of the player (logbook, 2026-10-19); review them at every Bevy upgrade.
ignore = [
  { id = "RUSTSEC-2026-0344", reason = "ruzstd 0.8 via bevy_image, no compatible fix yet; the game only decompresses its own trusted assets, never downloaded files" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, via ab_glyph/sctk-adwaita (Wayland window decorations); only parses system fonts" },
]

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "ISC",
  "MPL-2.0",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
]
confidence-threshold = 0.9
# The list is the project policy, not an inventory: unused entries are fine.
unused-allowed-license = "allow"

# egui's default fonts (debug UI only). Free font licences, accepted for this crate
# only; the game UI will ship its own OFL fonts, and this exception will go.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
