# cargo-deny configuration. The licence list mirrors CLAUDE.md ("Contraintes non négociables").

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "ISC",
  "MPL-2.0",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
]
confidence-threshold = 0.9
# The list is the project policy, not an inventory: unused entries are fine.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
